name: Actualización diaria de la liga

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_futbuteo.py"
      - ".github/workflows/daily-league-sync.yml"
  schedule:
    # Todos los días a las 16:10 UTC (17:10 en Catalunya durante el horario de invierno).
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planadeu-daily-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    # Use a club-controlled runner when FCF/public sources block GitHub-hosted IPs.
    runs-on: ${{ fromJSON(vars.FCF_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de importación y navegador
        run: |
          python -m pip install --disable-pip-version-check "psycopg2-binary==2.9.11" "playwright==1.55.0"
          python -m playwright install chromium
      - name: Validar fuentes y, solo si está autorizado, sincronizar jornadas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENABLE_FOOTBALL_IMPORT: "true" # Importa jornadas validadas y asigna a Planadeu el equipo que descansa cuando el complemento es único.
          CLUB_FIXTURES_URL: ${{ vars.CLUB_FIXTURES_URL }}
          CLUB_FIXTURES_TOKEN: ${{ secrets.CLUB_FIXTURES_TOKEN }}
          # A focused round can be selected with repository variable SYNC_MATCHDAY.
          # With it unset, the run checks every round from 1 to 30.
          SYNC_MATCHDAY: ${{ vars.SYNC_MATCHDAY }}
        run: python scripts/sync_futbuteo.py
