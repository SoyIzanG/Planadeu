name: Actualización diaria de la liga

on:
  schedule:
    # Todos los días a las 06:20 UTC (08:20 en Catalunya durante horario de verano).
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planadeu-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia PostgreSQL
        run: python -m pip install --disable-pip-version-check "psycopg2-binary==2.9.11"
      - name: Sincronizar jornadas verificadas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASON_ID: "1"
        run: python scripts/sync_futbuteo.py
