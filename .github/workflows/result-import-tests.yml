name: Comprobar importación de resultados

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "app/blueprints/matches/**"
      - "app/templates/matches/**"
      - ".github/workflows/result-import-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import-test dependency
        run: python -m pip install --disable-pip-version-check psycopg2-binary==2.9.11
      - name: Validate import safeguards without accessing Supabase
        run: python -m unittest discover -s tests -v
