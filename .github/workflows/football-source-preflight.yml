name: Football source preflight

on:
  push:
    branches:
      - feat/fcf-automatic-sync
  schedule:
    # 05:15 UTC daily. UTC is used because GitHub Actions cron does not track
    # Europe/Madrid daylight-saving changes.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-source-preflight
  cancel-in-progress: false

jobs:
  preflight:
    # Set repository variable FCF_RUNNER_LABELS to a JSON array such as
    # ["self-hosted","linux","x64"] when GitHub-hosted IPs are blocked by FCF.
    runs-on: ${{ fromJSON(vars.FCF_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser for FCF public API fallback
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0" "psycopg2-binary==2.9.11"
          python -m playwright install chromium

      - name: Initialize diagnostic report
        run: |
          mkdir -p reports
          printf '{"status":"not-run"}\n' > reports/football-source-preflight.json

      - name: Run preflight unit tests
        run: python -m unittest discover -s tests -v

      - name: Check official and complementary sources
        id: source-check
        env:
          FCF_GROUP_ID: ${{ vars.FCF_GROUP_ID }}
          FCF_MATCHDAY: ${{ vars.FCF_MATCHDAY }}
        run: |
          mkdir -p reports
          set +e
          python scripts/fcf_sync.py > reports/football-source-preflight.json
          status=$?
          cat reports/football-source-preflight.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-source-preflight
          path: reports/football-source-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow when a source check fails
        if: steps.source-check.outputs.exit_code != '0'
        run: |
          echo "One or more football sources failed preflight. See the report artifact."
          exit 1
